name: Bug Report
description: Report an issue, false diagnostic, or unexpected failure in EnvDoctor.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked existing issues to avoid duplicates.
        **Note:** EnvDoctor never logs secret values, but please review your pasted logs before submitting to ensure no sensitive paths, credentials, or proprietary names are exposed.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug or unexpected behavior.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run command 'envdoctor check /path/to/project'
        2. Notice that runtime 'XYZ' was misidentified as ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Traceback
      description: Paste relevant terminal output, logs, or error tracebacks here.
      render: shell

  - type: input
    id: version
    attributes:
      label: EnvDoctor Version
      description: Run `envdoctor --version`
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System & Architecture
      description: Select your operating system and hardware platform.
      options:
        - "macOS - Apple Silicon (M1/M2/M3/M4)"
        - "macOS - Intel (x86_64)"
        - "macOS - Rosetta 2 translation"
        - "Linux / POSIX (Ubuntu/Debian/Arch/Fedora/etc.)"
        - "Other (please specify in comments)"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python3 --version`
      placeholder: "e.g., Python 3.11.7"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Info (Optional)
      description: If possible, run `envdoctor info --json` and paste the sanitized output here.
      render: json

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have confirmed that no secrets, tokens, or private credentials are included in this report.
          required: true
