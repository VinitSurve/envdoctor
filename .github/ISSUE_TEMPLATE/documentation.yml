name: Documentation Improvement
description: Report an inaccuracy, missing guide, or suggest enhancements to EnvDoctor docs.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve EnvDoctor documentation! Clear and accurate documentation makes the tool better for everyone.

  - type: input
    id: doc-location
    attributes:
      label: Documentation Page or Section
      description: Which file, URL, or CLI command help needs improvement?
      placeholder: "e.g., docs/configuration.md or envdoctor check --help"
    validations:
      required: true

  - type: textarea
    id: issue-description
    attributes:
      label: What is unclear, inaccurate, or missing?
      description: Describe the problem with the current documentation.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Suggested Improvement / Proposed Text
      description: How should the documentation be updated? If you have specific wording, please include it.
      placeholder: "e.g., Replace the example with ..."

  - type: checkboxes
    id: pr-intent
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request fixing this documentation issue.
